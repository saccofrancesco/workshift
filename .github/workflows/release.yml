name: Release Tauri App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: Build and release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
            assetProfile: windows-x64

          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            assetProfile: linux-x64

          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            assetProfile: macos-aarch64

          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
            assetProfile: macos-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Validate tag/version alignment
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = \"([^\"]+)\"/\1/')"

          echo "tag=${TAG_VERSION} package=${PACKAGE_VERSION} tauri=${TAURI_VERSION} cargo=${CARGO_VERSION}"

          [[ "${PACKAGE_VERSION}" == "${TAG_VERSION}" ]] || { echo "package.json version does not match ${GITHUB_REF_NAME}"; exit 1; }
          [[ "${TAURI_VERSION}" == "${TAG_VERSION}" ]] || { echo "tauri.conf.json version does not match ${GITHUB_REF_NAME}"; exit 1; }
          [[ "${CARGO_VERSION}" == "${TAG_VERSION}" ]] || { echo "Cargo.toml version does not match ${GITHUB_REF_NAME}"; exit 1; }

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: See the assets to download this version and install.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      - name: Upload stable alias assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          find_newest_match() {
            local pattern="$1"
            local -a matches=()

            while IFS= read -r -d '' file; do
              matches+=("${file}")
            done < <(find src-tauri/target -type f -name "$pattern" -print0)

            if [[ "${#matches[@]}" -eq 0 ]]; then
              echo ""
              return 0
            fi

            local source_path="${matches[0]}"
            for file in "${matches[@]}"; do
              if [[ "${file}" -nt "${source_path}" ]]; then
                source_path="${file}"
              fi
            done

            echo "${source_path}"
          }

          upload_alias_required() {
            local pattern="$1"
            local alias_name="$2"
            local source_path
            source_path="$(find_newest_match "$pattern")"

            if [[ -z "${source_path}" ]]; then
              echo "Could not find a bundled asset matching pattern: ${pattern}"
              exit 1
            fi

            echo "Uploading alias ${alias_name} from ${source_path}"
            gh release upload "${GITHUB_REF_NAME}" "${source_path}#${alias_name}" --clobber --repo "${GITHUB_REPOSITORY}"
          }

          upload_alias_optional() {
            local pattern="$1"
            local alias_name="$2"
            local source_path
            source_path="$(find_newest_match "$pattern")"

            if [[ -z "${source_path}" ]]; then
              echo "Skipping optional alias ${alias_name}; no artifact matching ${pattern}"
              return 0
            fi

            echo "Uploading alias ${alias_name} from ${source_path}"
            gh release upload "${GITHUB_REF_NAME}" "${source_path}#${alias_name}" --clobber --repo "${GITHUB_REPOSITORY}"
          }

          case "${{ matrix.assetProfile }}" in
            windows-x64)
              upload_alias_required "*x64-setup.exe" "workshift-windows-x64-setup.exe"
              upload_alias_required "*x64_en-US.msi" "workshift-windows-x64.msi"
              ;;
            linux-x64)
              upload_alias_required "*_amd64.AppImage" "workshift-linux-x64.AppImage"
              upload_alias_required "*_amd64.deb" "workshift-linux-x64.deb"
              upload_alias_required "*x86_64.rpm" "workshift-linux-x64.rpm"
              ;;
            macos-aarch64)
              upload_alias_required "*_aarch64.dmg" "workshift-macos-aarch64.dmg"
              upload_alias_optional "*_aarch64.app.tar.gz" "workshift-macos-aarch64.app.tar.gz"
              ;;
            macos-x64)
              upload_alias_required "*_x64.dmg" "workshift-macos-x64.dmg"
              upload_alias_optional "*_x64.app.tar.gz" "workshift-macos-x64.app.tar.gz"
              ;;
            *)
              echo "Unknown asset profile: ${{ matrix.assetProfile }}"
              exit 1
              ;;
          esac
